plugins {
    id 'com.android.application'
}

android {
    namespace 'fi.iki.murgo.iltasoitto.app'
    compileSdk 36

    defaultConfig {
        applicationId "fi.iki.murgo.iltasoitto.app"
        minSdk 21
        targetSdk 36
        versionCode 7
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        // kotlin-stdlib-jdk7/jdk8 were merged into kotlin-stdlib since 1.8.0;
        // Jetifier pulls in 1.6.21 of the jdk variants which still have the duplicate classes.
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
